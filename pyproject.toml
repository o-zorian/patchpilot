[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A controlled, auditable coding-agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "PyYAML>=6.0.2",
  "redis>=6.2",
  "SQLAlchemy>=2.0.41",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18.2,<1.19",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
patchpilot = "patchpilot.cli.app:app"
patchpilot-api = "patchpilot.api.app:main"
patchpilot-worker = "patchpilot.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
