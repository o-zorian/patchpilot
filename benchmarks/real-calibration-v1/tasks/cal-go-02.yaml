version: "1"
id: cal-go-02
title: Match complete comma-separated header tokens
repository: {path: repos/calibration, base_ref: main, language: go}
goal: ContainsToken must compare complete comma-separated tokens case-insensitively after trimming whitespace, never substrings.
allowed_paths: [header/header.go]
denied_paths: [.git/**, "**/*_test.go"]
acceptance: {commands: [{argv: [go, test, ./header], timeout_seconds: 30}], required_tests: [TestContainsWholeToken]}
budget: {max_steps: 12, max_input_tokens: 60000, max_output_tokens: 10000, max_cost_usd: 0.12, max_wall_time_seconds: 300, max_changed_files: 1, max_patch_lines: 80}
execution: {network: false, cpu_limit: 1, memory_limit_mb: 512}
metadata: {difficulty: medium, tags: [go, "defect:protocol-parsing", calibration]}
