version: "1"
id: real-go-18
title: Round-trip reserved characters in opaque page tokens
repository: {path: repos/go-service, base_ref: main, language: go}
goal: Encode and Decode must round-trip arbitrary tenant and cursor strings containing colon, ampersand, equals, and Unicode. Keep URL-safe unpadded base64 as the outer transport and reject malformed payloads.
allowed_paths: [pagetoken/encode.go, pagetoken/decode.go]
denied_paths: [.git/**, "**/*_test.go"]
acceptance: {commands: [{argv: [go, test, ./pagetoken], timeout_seconds: 45}], required_tests: [TestRoundTripTenantContainingColon]}
budget: {max_steps: 20, max_input_tokens: 120000, max_output_tokens: 24000, max_cost_usd: 0.25, max_wall_time_seconds: 600, max_changed_files: 2, max_patch_lines: 180}
execution: {network: false, cpu_limit: 2, memory_limit_mb: 768}
metadata: {difficulty: medium, tags: [go, "defect:protocol-parsing", multi-file, curated-snapshot]}
