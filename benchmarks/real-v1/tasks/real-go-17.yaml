version: "1"
id: real-go-17
title: Prevent sibling-prefix path escape
repository: {path: repos/go-service, base_ref: main, language: go}
goal: Join must accept paths contained by root and reject parent or sibling traversal even when the sibling shares the root string prefix. Use filepath-aware containment, not raw string prefix checks.
allowed_paths: [safepath/path.go]
denied_paths: [.git/**, "**/*_test.go"]
acceptance: {commands: [{argv: [go, test, ./safepath], timeout_seconds: 45}], required_tests: [TestSiblingPrefixRejected]}
budget: {max_steps: 20, max_input_tokens: 120000, max_output_tokens: 24000, max_cost_usd: 0.25, max_wall_time_seconds: 600, max_changed_files: 1, max_patch_lines: 160}
execution: {network: false, cpu_limit: 2, memory_limit_mb: 768}
metadata: {difficulty: medium, tags: [go, "defect:path-security", curated-snapshot]}
