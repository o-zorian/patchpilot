version: "1"
id: real-go-19
title: Classify wrapped temporary errors as retryable
repository: {path: repos/go-service, base_ref: main, language: go}
goal: ShouldRetry must recognize ErrTemporary anywhere in a standard Go error chain, including wrapped and joined errors, while rejecting unrelated errors.
allowed_paths: [retry/retry.go]
denied_paths: [.git/**, "**/*_test.go"]
acceptance: {commands: [{argv: [go, test, ./retry], timeout_seconds: 45}], required_tests: [TestWrappedTemporaryErrorRetries]}
budget: {max_steps: 20, max_input_tokens: 120000, max_output_tokens: 24000, max_cost_usd: 0.25, max_wall_time_seconds: 600, max_changed_files: 1, max_patch_lines: 100}
execution: {network: false, cpu_limit: 2, memory_limit_mb: 768}
metadata: {difficulty: medium, tags: [go, "defect:error-chain", curated-snapshot]}
