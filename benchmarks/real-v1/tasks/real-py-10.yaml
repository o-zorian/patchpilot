version: "1"
id: real-py-10
title: Scope authorization cache entries by project
repository: {path: repos/python-service, base_ref: main, language: python}
goal: PermissionCache decisions must be keyed by both user and project. Repeated identical checks may reuse a result, but a decision for one project or user must never authorize another. Introduce a typed immutable key.
allowed_paths: [realbench/models.py, realbench/security.py]
denied_paths: [.git/**, tests/**]
acceptance: {commands: [{argv: [python, -m, pytest, tests/py10], timeout_seconds: 45}], required_tests: [test_permission_cache_is_scoped_to_project]}
budget: {max_steps: 20, max_input_tokens: 120000, max_output_tokens: 24000, max_cost_usd: 0.25, max_wall_time_seconds: 600, max_changed_files: 2, max_patch_lines: 180}
execution: {network: false, cpu_limit: 2, memory_limit_mb: 768}
metadata: {difficulty: hard, tags: [python, "defect:authorization-scope", multi-file, curated-snapshot]}
