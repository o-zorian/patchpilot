version: "1"
id: py-001
title: Normalize non-positive page numbers
repository: {path: repos/python-cases, base_ref: main, language: python}
goal: Update clamp_page so zero and negative pages are treated as page 1 while positive pages are unchanged.
allowed_paths: [cases.py]
denied_paths: [.git/**]
acceptance:
  commands: [{argv: [python, -m, pytest], timeout_seconds: 30}]
  required_tests: [test_page_zero_is_first]
budget: &budget {max_steps: 15, max_input_tokens: 80000, max_output_tokens: 16000, max_cost_usd: 0.2, max_wall_time_seconds: 120, max_changed_files: 1, max_patch_lines: 30}
execution: {network: false, cpu_limit: 2, memory_limit_mb: 1024}
metadata: {difficulty: easy, tags: [python, "defect:boundary"]}
